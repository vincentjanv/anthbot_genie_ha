start_full_mow:
  name: Start Full Mow
  description: Start mowing on selected Anthbot mower(s).
  target:
    entity:
      integration: anthbot_genie
  fields:
    serial_number:
      name: Serial number
      description: Optional mower serial number or list of serial numbers.
      example: "YOUR_MOWER_SERIAL"
      selector:
        text:

stop_mow:
  name: Stop Mow
  description: Stop all current tasks on selected Anthbot mower(s).
  target:
    entity:
      integration: anthbot_genie
  fields:
    serial_number:
      name: Serial number
      description: Optional mower serial number or list of serial numbers.
      example: "YOUR_MOWER_SERIAL"
      selector:
        text:

return_to_dock:
  name: Return To Dock
  description: Send selected Anthbot mower(s) back to the charging dock.
  target:
    entity:
      integration: anthbot_genie
  fields:
    serial_number:
      name: Serial number
      description: Optional mower serial number or list of serial numbers.
      example: "YOUR_MOWER_SERIAL"
      selector:
        text:

set_mow_height:
  name: Set Mow Height
  description: Set cutting height on selected Anthbot mower(s).
  target:
    entity:
      integration: anthbot_genie
  fields:
    mow_height:
      name: Mow height
      description: Cutting height in millimeters.
      required: true
      example: "50"
      selector:
        select:
          options:
            - label: "30"
              value: 30
            - label: "35"
              value: 35
            - label: "40"
              value: 40
            - label: "45"
              value: 45
            - label: "50"
              value: 50
            - label: "55"
              value: 55
            - label: "60"
              value: 60
            - label: "65"
              value: 65
            - label: "70"
              value: 70
    serial_number:
      name: Serial number
      description: Optional mower serial number or list of serial numbers.
      example: "YOUR_MOWER_SERIAL"
      selector:
        text:

set_voice_volume:
  name: Set Voice Volume
  description: Set voice volume on selected Anthbot mower(s), from 0 to 100.
  target:
    entity:
      integration: anthbot_genie
  fields:
    voice_volume:
      name: Voice volume
      description: Volume level from 0 to 100.
      required: true
      example: 50
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
    serial_number:
      name: Serial number
      description: Optional mower serial number or list of serial numbers.
      example: "YOUR_MOWER_SERIAL"
      selector:
        text:

set_custom_mowing_direction:
  name: Set Custom Mowing Direction
  description: Set custom mowing direction and enable/disable the adaptive direction toggle.
  target:
    entity:
      integration: anthbot_genie
  fields:
    mow_direction:
      name: Mowing direction
      description: Direction in degrees (0 to 180).
      required: true
      example: 147
      selector:
        number:
          min: 0
          max: 180
          step: 1
          mode: box
    enable_custom_direction:
      name: Enable custom direction
      description: Enable or disable custom mowing direction.
      required: false
      default: true
      selector:
        boolean:
    serial_number:
      name: Serial number
      description: Optional mower serial number or list of serial numbers.
      example: "YOUR_MOWER_SERIAL"
      selector:
        text:

start_zone_mow:
  name: Start Zone Mow
  description: Start mowing one or more manual zones on selected Anthbot mower(s).
  target:
    entity:
      integration: anthbot_genie
  fields:
    zones:
      name: Zones
      description: Zone id, zone name, comma-separated list, or YAML list of manual zones.
      required: true
      example: "100, Back lawn"
      selector:
        text:
    serial_number:
      name: Serial number
      description: Optional mower serial number or list of serial numbers.
      example: "YOUR_MOWER_SERIAL"
      selector:
        text:

start_auto_zone_mow:
  name: Start Auto-Zone Mow
  description: Start mowing one or more auto-zones on selected Anthbot mower(s).
  target:
    entity:
      integration: anthbot_genie
  fields:
    auto_zones:
      name: Auto zones
      description: Auto-zone id, name, comma-separated list, or YAML list of auto-zones.
      required: true
      example: "1, Front area"
      selector:
        text:
    serial_number:
      name: Serial number
      description: Optional mower serial number or list of serial numbers.
      example: "YOUR_MOWER_SERIAL"
      selector:
        text:
